<body id="body">
    <div class="content"></div>
    <div class="add"><i class="fas fa-circle-plus"></i></div>
    <form action="add-product.php" method="post" enctype="multipart/form-data" class="form in-form">
        <i class="fas fa-circle-xmark"></i>
        <h3 class="in-form">Afegir producte</h3>
        <input type="text" name="name" class="in-form" id="name" placeholder="Nom">

        <input type="text" name="price" class="in-form" id="price" placeholder="Preu">
        <input type="text" name="url" class="in-form" id="url" placeholder="Url">
        <input type="file" name="img" class="in-form" id="img" accept="image/*" placeholder="Imatge">

        <input type="text" name="pq" class="in-form" id="pq" placeholder="Motiu">
