<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <title>Cadira Ergonòmica</title>
    <link rel="stylesheet" href="../product.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="website icon" type="jpg" href="../img/icon.jpg">
</head>

<body>
    <div class="general">
        <div class="imagen">
            <img src="../img/img-1.jpg" alt="Cadira Ergonòmica">
        </div>
        <div class="description">
            <h1>Cadira Ergonòmica</h1>
            <p>Cadira Escriptori Ergonomica Ajustable amb Reposabraços Beix.</p>
            <h2 class="price">46,99 €</h2>
            <div class="button">
                <button class="buy btn" data-url="https://www.amazon.es/gp/product/B0G6X6NP4X/ref=ox_sc_act_image_1?smid=ABU9ZGHA5QJIH&amp;th=1">Comprar</button>
                <button class="pq btn" title="Per què?">?</button>
            </div>
        </div>
        <i class="fas fa-house" onclick="location.href = '../index.html'"></i>
    </div>
    <div class="why">Per no agafar dolor d&#039;esquena o de coll al estar asegut en el escriptori,</div>
    <script>
        const general = document.querySelector(".general");
        const buy = document.querySelector(".buy");
        const why = document.querySelector(".why");

        buy.addEventListener("click", () => {
            window.open(buy.dataset.url, "_blank")
        })

        general.addEventListener("click", (event) => {
            let positionClick = event.target;
            if (positionClick.classList.contains("pq")) {
                why.style.display = "block"
            } else{
                why.style.display = "none"
            }
        })
    </script>
</body>

</html>
