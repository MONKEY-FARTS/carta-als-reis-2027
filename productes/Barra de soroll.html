<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <title>Barra de soroll</title>
    <link rel="stylesheet" href="../product.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="website icon" type="jpg" href="../img/icon.jpg">
</head>

<body>
    <div class="general">
        <div class="imagen">
            <img src="../img/img-12.jpg" alt="Cadira Ergonòmica" style="width: 600px; height: auto;">
        </div>
        <div class="description">
            <h1>Barra de soroll</h1>
            <p>Barra de soroll GXTrust blanca per a l&#039;ordinador</p>
            <h2 class="price">39,99 €</h2>
            <div class="button">
                <button class="buy btn" data-url="https://www.amazon.es/Trust-Gaming-Iluminaci%C3%B3n-Altavoces-Alimentaci%C3%B3n/dp/B0FH252S5P/?_encoding=UTF8&amp;pd_rd_w=E9NpO&amp;content-id=amzn1.sym.fb082bbf-62df-41cf-8781-48f664b05893&amp;pf_rd_p=fb082bbf-62df-41cf-8781-48f664b05893&amp;pf_rd_r=YXW6NJ1TQ4CJ0GKKM4R6&amp;pd_rd_wg=wQYU0&amp;pd_rd_r=5d430474-7e29-4195-837c-4c2dff0e2332&amp;ref_=pd_hp_d_r_atf_dealz_wd_cs&amp;th=1">Comprar</button>
                <button class="pq btn" title="Per què?">?</button>
            </div>
        </div>
        <i class="fas fa-house" onclick="location.href = '../index.html'"></i>
    </div>
    <div class="why">Caprici, per poder escoltar millor l&#039;ordinador.</div>
    <script>
        const general = document.querySelector(".general");
        const buy = document.querySelector(".buy");
        const why = document.querySelector(".why");

        buy.addEventListener("click", () => {
            window.open(buy.dataset.url, "_blank")
        })

        general.addEventListener("click", (event) => {
            let positionClick = event.target;
            if (positionClick.classList.contains("pq")) {
                why.style.display = "block"
            } else{
                why.style.display = "none"
            }
        })
    </script>
</body>

</html>
