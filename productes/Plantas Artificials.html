<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <title>Plantas Artificials</title>
    <link rel="stylesheet" href="../product.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="website icon" type="jpg" href="../img/icon.jpg">
</head>

<body>
    <div class="general">
        <div class="imagen">
            <img src="../img/img-7.jpg" alt="Cadira Ergonòmica">
        </div>
        <div class="description">
            <h1>Plantas Artificials</h1>
            <p>Pack de 8 mini plantes artificials decoratives.</p>
            <h2 class="price">19,99 €</h2>
            <div class="button">
                <button class="buy btn" data-url="https://www.amazon.es/dp/B09PQGJ6B7?ref=cm_sw_r_cso_wa_apan_dp_ZMEAZVK5BFZ1N2VT7M07&amp;ref_=cm_sw_r_cso_wa_apan_dp_ZMEAZVK5BFZ1N2VT7M07&amp;social_share=cm_sw_r_cso_wa_apan_dp_ZMEAZVK5BFZ1N2VT7M07">Comprar</button>
                <button class="pq btn" title="Per què?">?</button>
            </div>
        </div>
        <i class="fas fa-house" onclick="location.href = '../index.html'"></i>
    </div>
    <div class="why">Decoració</div>
    <script>
        const general = document.querySelector(".general");
        const buy = document.querySelector(".buy");
        const why = document.querySelector(".why");

        buy.addEventListener("click", () => {
            window.open(buy.dataset.url, "_blank")
        })

        general.addEventListener("click", (event) => {
            let positionClick = event.target;
            if (positionClick.classList.contains("pq")) {
                why.style.display = "block"
            } else{
                why.style.display = "none"
            }
        })
    </script>
</body>

</html>
